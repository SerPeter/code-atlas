{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Not found — Code Atlas{% endblock %}

{% block main %}
<main style="flex:1;min-width:0;position:relative">
  <div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(420px,80%);background:var(--color-bg);border:1px solid var(--color-divider);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-md)">
    <div style="{{ m.label10() }}">No such entity</div>
    <div style="margin-top:6px;font-size:13px;line-height:1.55;word-break:break-all">
      Nothing in the graph carries the uid <strong>{{ uid }}</strong>. It may have been removed by a re-index, or the link may predate one.
    </div>
    <a href="/search" class="btn btn-secondary" style="margin-top:11px;height:28px;font-size:12px">Search instead</a>
  </div>
</main>
{% endblock %}
