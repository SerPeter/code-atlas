# Datasources as code. Without this the "optional telemetry profile" means "and then
# wire up three datasources by hand before you can see anything".
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428

  # VictoriaTraces speaks the Jaeger query API, so Grafana's built-in Jaeger
  # datasource reads it with no plugin.
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://victoria-traces:10428/select/jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
