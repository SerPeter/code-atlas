# Code Atlas configuration
# See: https://github.com/SerPeter/code-atlas

[scope]
# Restrict indexing to these directory paths (leave empty for everything)
paths = []
# Override defaults entirely (uncomment to customize):
# include = ["*.py", "*.pyi"]
# exclude = [".git/", "node_modules/"]
# Extend defaults (recommended):
extend_include = []
extend_exclude = []

[libraries]
# Fully index these libraries (parse source, embed, full graph)
full_index = []
# Index at type-stub level only (public API signatures)
stub_index = []

[monorepo]
# Auto-detect sub-projects by project markers (pyproject.toml, Cargo.toml, etc.)
auto_detect = true
# Always include these paths when scoping queries (shared libs)
always_include = []

[embeddings]
# Provider: "tei", "litellm", "ollama"
provider = "tei"
model = "nomic-ai/nomic-embed-code"
base_url = "http://localhost:8080"
dimension = 768
# Hard input-token cap. Leave unset to ask litellm's model registry; SET IT when the
# registry does not know the model (any OpenRouter- or TEI-prefixed name, including the
# nomic model above), because an unknown cap means no chunking and no truncation, and
# one over-length node fails the whole provider call it was batched into -- taking the
# other 127 texts in that batch with it.
# This matters more since index.max_source_chars became 48,000 (~12,000 tokens): entity
# text used to be capped near 500 tokens, so nothing could exceed a limit even when none
# was known. It can now.
#   gemini-embedding-001    -> 2048
#   text-embedding-3-small  -> 8191
# max_input_tokens = 2048
# Max embedding chunks for a node whose text exceeds the cap (default 8).
# max_chunks = 8

[memgraph]
host = "localhost"
port = 7687

[redis]
host = "localhost"
port = 6379
db = 0
stream_prefix = "atlas"

[search]
default_token_budget = 8000
# Exclude test files from search results by default
test_filter = true
stub_filter = true
generated_filter = true
test_patterns = ["test_*", "*_test.py", "tests/", "__tests__/"]
generated_patterns = ["*_pb2.py", "*_pb2_grpc.py", "*.generated.*"]
# Max hop depth for caller/callee expansion
max_caller_depth = 1

# Optional ranking adjustments. Every rule that matches a result multiplies into its
# score, so two 1.5 rules give 2.25. Omit the section entirely for unchanged ranking.
#
# By path — gitignore-style patterns against the repo-relative path, same dialect as
# [scope] and .atlasignore:
# [[search.importance.paths]]
# glob = "src/code_atlas/search/**"
# factor = 1.5
#
# [[search.importance.paths]]
# glob = "wiki/inbox/"          # drafts rank below consolidated notes
# factor = 0.5
#
# By markdown frontmatter — `key` is dot-separated for nesting, and matches a list on
# membership or a scalar on equality (case-insensitive):
# [[search.importance.frontmatter]]
# key = "metadata.type"
# value = "decision"
# factor = 2.0
#
# Omit `value` to match whenever the key is present and truthy:
# [[search.importance.frontmatter]]
# key = "deprecated"
# factor = 0.25

[detectors]
# Enabled pattern detectors
enabled = [
    "test_mapping",
    "class_overrides",
    "di_injection",
    "module_exports",
]
