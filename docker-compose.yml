services:
  # ---------------------------------------------------------------------------
  # Memgraph — graph database with BM25 + vector search
  # ---------------------------------------------------------------------------
  memgraph:
    # MAGE-enabled image (not the plain community image) — required for the
    # leiden_community_detection.get()/community_detection.get() procedures
    # backing analyze_repo(analysis="communities")/find_communities.
    #
    # Pinned to 3.12.0, not 3.7.2: 3.7.2 segfaults in its Storage GC thread when
    # vector-indexed nodes are mass-deleted and re-inserted, which is exactly what
    # a full re-index does. Reproduced on demand and fixed by 3.9.0 ("Fixed a
    # segfault during vector index garbage collection when vertices or edges were
    # being inserted concurrently"). See ADR-0024.
    #
    # Upgrading an existing deployment: `docker compose pull && docker compose up -d`.
    image: memgraph/memgraph-mage:3.12.0
    restart: unless-stopped
    ports:
      - "7687:7687" # Bolt protocol
      - "7444:7444" # Monitoring
    volumes:
      - memgraph-data:/var/lib/memgraph
    environment:
      MEMGRAPH_ENTERPRISE_LICENSE: "" # Community edition
    deploy:
      resources:
        limits:
          memory: 4g # Docker-level limit — prevents OS OOM killer
    # --storage-access-timeout-sec: Memgraph defaults this to 1s. CREATE VECTOR INDEX
    # needs *unique* storage access, and on a graph this size it loses that race against
    # ordinary query traffic and the 300s periodic snapshot. The result was silent: four
    # of six vector indices (TypeDef, Value, Module, Note) went missing, and
    # _reconcile_search_indices retried and failed on every single `atlas index` run --
    # so `ensure_schema` never completed and 8,569 nodes stayed invisible to semantic
    # search. One second is not a budget for a DDL statement that has to quiesce storage.
    command: >
      --log-level=WARNING --memory-limit=3800 --storage-wal-enabled=true --storage-snapshot-interval-sec=300
      --storage-access-timeout-sec=30
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Valkey — event bus (Redis-compatible) for pipeline streams
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    deploy:
      resources:
        limits:
          # 2g/1536mb, raised from 384m/320mb. `noeviction` makes the ceiling a hard
          # outage, not a soft degradation: when the bus fills, every project's writes
          # are rejected, not just those of the project that filled it. One stream was
          # measured at 217MB, so the old 320mb left no room for a backlog plus the
          # embedding cache. The ~500MB gap between the two numbers is deliberate —
          # `appendonly yes` forks to rewrite the AOF and the copy-on-write spike is
          # charged to the same cgroup, so maxmemory must stay well under the limit or
          # the kernel OOM-kills the container instead of Valkey rejecting a write.
          memory: 2g
    command: >
      valkey-server --appendonly yes --appendfsync everysec --save "" --maxmemory 1536mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Test instances — isolated infra for integration tests:
  # docker compose --profile test up -d
  # ---------------------------------------------------------------------------
  memgraph-test:
    profiles: [test]
    # Same MAGE-enabled image as `memgraph` — integration tests exercising
    # community detection need the query module available here too.
    image: memgraph/memgraph-mage:3.12.0
    restart: unless-stopped
    ports:
      - "7688:7687" # Bolt protocol (test)
    tmpfs:
      # uid/gid required: a bare tmpfs mounts root-owned and Memgraph (uid 101) segfaults on startup
      - /var/lib/memgraph:rw,uid=101,gid=103,mode=0750
    environment:
      MEMGRAPH_ENTERPRISE_LICENSE: "" # Community edition
    deploy:
      resources:
        limits:
          memory: 2g
    command: >
      --log-level=WARNING --memory-limit=1800 --storage-wal-enabled=false
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-test:
    profiles: [test]
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 128m
    command: >
      valkey-server --appendonly no --save "" --maxmemory 64mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # TEI — text embeddings inference (self-hosted embeddings)
  # Optional: docker compose --profile tei up -d
  # ---------------------------------------------------------------------------
  tei:
    profiles: [tei]
    restart: unless-stopped
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    ports:
      - "8080:80"
    volumes:
      - tei-models:/data
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    command: --auto-truncate
    environment:
      MODEL_ID: ${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Telemetry — Victoria stack + OTel Collector + Grafana
  # Optional: docker compose --profile telemetry up -d
  #
  # code-atlas exports to ONE OTLP endpoint (observability.endpoint), because that is
  # what an OTLP SDK does; Victoria keeps metrics, logs and traces in three separate
  # services. The collector is what bridges the two — see configs/otel-collector.yaml.
  #
  # Turn it on with:
  #   ATLAS_OBSERVABILITY__ENABLED=true
  #   uv sync --extra otel          # the OTel packages are an optional extra
  #
  # Ports: Grafana 3000, VictoriaMetrics 8428, VictoriaLogs 9428,
  #        VictoriaTraces 10428, OTLP gRPC 4317, OTLP HTTP 4318.
  # 3000 and 8428 are popular; if another local stack already owns them, change the
  # host side of the mapping here rather than in the collector config.
  # ---------------------------------------------------------------------------
  otel-collector:
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.102.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC — what telemetry.py's default endpoint points at
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./configs/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    deploy:
      resources:
        limits:
          memory: 512m

  victoria-metrics:
    profiles: [telemetry]
    image: victoriametrics/victoria-metrics:v1.101.0
    restart: unless-stopped
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=3
      - --httpListenAddr=:8428
      # OTLP is not on by default; without this the collector's metrics pipeline 404s.
      - --opentelemetry.usePrometheusNaming
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  victoria-logs:
    profiles: [telemetry]
    image: victoriametrics/victoria-logs:v1.50.0
    restart: unless-stopped
    command:
      - --storageDataPath=/vlogs
      - --httpListenAddr=:9428
      - --retentionPeriod=30d
    ports:
      - "9428:9428"
    volumes:
      - victoria-logs-data:/vlogs

  victoria-traces:
    profiles: [telemetry]
    image: victoriametrics/victoria-traces:v0.9.0
    restart: unless-stopped
    command:
      - --storageDataPath=/vtraces
      - --httpListenAddr=:10428
      - --retentionPeriod=7d
    ports:
      - "10428:10428"
    volumes:
      - victoria-traces-data:/vtraces

  grafana:
    profiles: [telemetry]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # VictoriaLogs needs its own datasource plugin; Prometheus and Jaeger are built in.
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces

volumes:
  memgraph-data:
  valkey-data:
  tei-models:
  victoria-metrics-data:
  victoria-logs-data:
  victoria-traces-data:
  grafana-data:
