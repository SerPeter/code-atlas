# Code Atlas configuration
# See: https://github.com/SerPeter/code-atlas
#
# This file is committed and shared: it describes the CODEBASE — scope, detectors,
# rationale markers, monorepo layout, knowledge vault. It is the same for everyone.
#
# Anything that differs per machine — [redis], [memgraph], [embeddings], [backend] —
# belongs in one of these instead, most specific first. (The exception is the embedding
# POLICY keys below: which entities deserve a vector is a property of the codebase, so
# they stay here.)
#
#   1. ATLAS_* environment variables    ATLAS_BACKEND__GRAPH__MEMGRAPH__HOST=box.local
#                                       (nested sections use a double underscore;
#                                        export them from .envrc if you want them
#                                        loaded automatically — atlas never reads .env)
#   2. atlas.local.toml                 gitignored, sits beside this file, merges per key
#
# Both override this file. atlas.local.toml merges rather than replaces, so setting
# [memgraph] host there keeps this file's port. Discovery for both files starts at the
# git root, so it does not matter which directory you run atlas from.

[scope]
# Restrict indexing to these directory paths (leave empty for everything)
paths = []
# Override defaults entirely (uncomment to customize):
# include = ["*.py", "*.pyi"]
# exclude = [".git/", "node_modules/"]
# Extend defaults (recommended):
extend_include = []
extend_exclude = []

[libraries]
# Fully index these libraries (parse source, embed, full graph)
full_index = []
# Index at type-stub level only (public API signatures)
stub_index = []

[monorepo]
# Auto-detect sub-projects by project markers (pyproject.toml, Cargo.toml, etc.)
auto_detect = true
# Always include these paths when scoping queries (shared libs)
always_include = []

[embeddings]
# Provider: "tei", "litellm", "ollama"
provider = "tei"
model = "nomic-ai/nomic-embed-code"
base_url = "http://localhost:8080"
dimension = 768
# Hard input-token cap. Leave unset to ask litellm's model registry; SET IT when the
# registry does not know the model (any OpenRouter- or TEI-prefixed name, including the
# nomic model above), because an unknown cap means no chunking and no truncation, and
# one over-length node fails the whole provider call it was batched into -- taking the
# other 127 texts in that batch with it.
# This matters more since index.max_source_chars became 48,000 (~12,000 tokens): entity
# text used to be capped near 500 tokens, so nothing could exceed a limit even when none
# was known. It can now.
#   gemini-embedding-001    -> 2048
#   text-embedding-3-small  -> 8191
# max_input_tokens = 2048
# Max embedding chunks for a node whose text exceeds the cap (default 8).
# max_chunks = 8
#
# Which entities get a vector (ADR-0047). Indexing a file and embedding its entities are
# two decisions: an entity excluded here is still parsed, named, traversable and found by
# BM25 and the graph — it just never reaches the provider, and in hybrid search it ranks
# at the floor of the vector channel rather than vanishing from it.
#
# The default excludes the two kinds the generic structural fallback emits — the handler
# that runs when NO dialect recognised the file. A recognised one (ci_job, k8s_resource,
# compose_service, dbt_source, ...) keeps its vector without a line of config.
# exclude_kinds = ["config_setting", "config_section"]
# Path patterns, gitignore dialect. Empty by default.
# exclude = ["vendor/**", "generated/**"]
# Re-admit; beats both axes.
# include = ["ops/critical/"]

[backend]
# Where the embedded backends keep their files: graph.sqlite3, queue.sqlite3 and
# ratelimit.sqlite3 all live here, relative to the git root. The directory ignores
# itself from git on creation, since the index is machine-specific.
sqlite_data_dir = ".atlas"

# Declaring a backend IS selecting it. Configure exactly one graph backend and one
# queue backend -- two of either is a config error rather than a silent precedence
# rule.
#
# Omit a section entirely to get "auto": probe the network backend and fall back to
# embedded SQLite when it is unreachable. That is the zero-config path, and the only
# one that can fall back. Once you name a backend, an unreachable one FAILS -- rather
# than quietly rebuilding the whole graph into .atlas/ and re-buying every embedding,
# which is what "auto" did here for 214 MB.
#
# To run a different backend on ONE machine without editing this shared file, set the
# declared one to false in atlas.local.toml and declare yours:
#     [backend.graph]
#     memgraph = false
#     sqlite = {}

[backend.graph.memgraph]
host = "localhost"
port = 7687
# Both timeouts are worth raising on a large monorepo, and neither default is
# generous. write_timeout_s (60s) is tight for a full reindex under any residual
# write contention -- several sessions' MCP daemons can auto-catchup concurrently.
# query_timeout_s (10s) is tight for cross-project import resolution, which is a
# labelless MATCH on project_name + name and unindexed.
# write_timeout_s = 180.0
# query_timeout_s = 120.0

# [backend.graph.sqlite]
# The embedded graph -- no server, no Docker. Slower on large graphs, and its vector
# index is a bit-quantized shortlist rescored against the real vectors rather than an
# exact scan (ADR-0046). Nothing to configure: the location is sqlite_data_dir above,
# and the dimension follows [embeddings].

[backend.queue.valkey]
host = "localhost"
port = 6379
db = 0
stream_prefix = "atlas"

# [backend.queue.sqlite]
# The embedded event queue. Also switches the embedding rate limiter to its SQLite
# mirror (ADR-0044), which paces against a private file -- so several machines sharing
# one provider budget should not use it.

[search]
default_token_budget = 8000
# Exclude test files from search results by default
test_filter = true
stub_filter = true
generated_filter = true
test_patterns = ["test_*", "*_test.py", "tests/", "__tests__/"]
generated_patterns = ["*_pb2.py", "*_pb2_grpc.py", "*.generated.*"]
# Max hop depth for caller/callee expansion
max_caller_depth = 1

# Optional ranking adjustments. Every rule that matches a result multiplies into its
# score, so two 1.5 rules give 2.25. Omit the section entirely for unchanged ranking.
#
# By path — gitignore-style patterns against the repo-relative path, same dialect as
# [scope] and .atlasignore:
# [[search.importance.paths]]
# glob = "src/code_atlas/search/**"
# factor = 1.5
#
# [[search.importance.paths]]
# glob = "wiki/inbox/"          # drafts rank below consolidated notes
# factor = 0.5
#
# By markdown frontmatter — `key` is dot-separated for nesting, and matches a list on
# membership or a scalar on equality (case-insensitive):
# [[search.importance.frontmatter]]
# key = "metadata.type"
# value = "decision"
# factor = 2.0
#
# Omit `value` to match whenever the key is present and truthy:
# [[search.importance.frontmatter]]
# key = "deprecated"
# factor = 0.25

[detectors]
# Enabled pattern detectors
enabled = [
    "test_mapping",
    "class_overrides",
    "di_injection",
    "module_exports",
]
