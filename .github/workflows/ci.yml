name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `uv sync --locked` rather than a bare `uv sync`, in every job. A bare sync
# silently *updates* a stale lockfile instead of failing, which is precisely how
# uv.lock sat at 0.7.0 while pyproject.toml said 0.8.4 across several releases with
# nothing to notice. --locked asserts the lock is up to date with pyproject and
# errors if it is not, so drift is a red PR instead of an invisible rewrite.
#
# Not --frozen: that installs the lock without checking it against pyproject, which
# is the same blind spot wearing a different hat.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"
      - run: uv sync --locked --group dev --all-extras
      - run: uv run ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"
      - run: uv sync --locked --group dev --all-extras
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"
      - run: uv sync --locked --group dev --all-extras
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"
      - run: uv sync --locked --group dev --all-extras
      - run: uv run pytest -m "not integration and not bench and not tei"

  # The suite that actually validates the product. CI ran only
  # `-m "not integration and not bench and not tei"` until ATL-114, which excluded
  # ~365 tests including tests/integration/graph/test_client.py — the Memgraph
  # client's ONLY real coverage. Every Cypher query, all seven resolve_* passes,
  # incremental upsert and schema migration reached main untested, and that is how a
  # 60s CALLS-write timeout got as far as a user's first real C++ project.
  integration:
    runs-on: ubuntu-latest
    services:
      memgraph:
        image: memgraph/memgraph-mage:3.12.0
        ports:
          # Host 7688, NOT 7687: the conftest isolation guard refuses the
          # production ports by design, and it was right to refuse them here.
          - 7688:7687
        options: >-
          --health-cmd "echo 'RETURN 1;' | mgconsole || exit 1" --health-interval 10s --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The git-signals tests mine this checkout's own history; a shallow
          # clone leaves parent commits as missing objects ("fatal: bad object").
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14-dev"
      - run: uv sync --locked --group dev --all-extras
      # Pointing the tests at the service containers rather than letting
      # testcontainers start its own: one instance, already health-gated by the job.
      #
      # NOT parallelised. `graph_client` is function-scoped and wipes the database
      # before every test; under xdist the session fixtures run once per worker, so
      # with these env vars set every worker shares one instance and they wipe each
      # other mid-test. The failures look like nondeterministic product bugs.
      - run: uv run pytest -m integration
        env:
          ATLAS_TEST_MEMGRAPH_PORT: "7688"
          ATLAS_TEST_VALKEY_PORT: "6380"
