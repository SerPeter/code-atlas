<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}code-atlas{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #d8d8d8;
        --bg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8e8e8;
          --muted: #999;
          --line: #333;
          --bg: #16181a;
        }
      }
      body {
        margin: 0;
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        border-bottom: 1px solid var(--line);
        padding: 0.75rem 1.25rem;
        display: flex;
        gap: 1rem;
        align-items: baseline;
      }
      header b {
        font-weight: 600;
      }
      main {
        padding: 1.25rem;
        max-width: 60rem;
      }
      .muted {
        color: var(--muted);
      }
      .caveat {
        border-left: 3px solid #d08770;
        padding: 0.5rem 0.75rem;
        margin: 1rem 0;
        background: color-mix(in srgb, #d08770 8%, transparent);
      }
      table {
        border-collapse: collapse;
      }
      .resolved {
        color: #4a7c59;
        font-weight: 600;
      }
      .guess {
        color: #b5761f;
        font-weight: 600;
      }
      .structural {
        color: #5a6a86;
        font-weight: 600;
      }
      .dsm {
        border-collapse: collapse;
      }
      .dsm td {
        width: 11px;
        height: 11px;
        padding: 0;
        border: 1px solid var(--line);
      }
      .dsm .dsm-label {
        width: auto;
        height: auto;
        padding: 0 0.4rem;
        border: none;
        font-size: 11px;
        text-align: right;
        white-space: nowrap;
      }
      .dsm .dsm-diag {
        background: var(--line);
      }
      .dsm .dsm-dep {
        background: #5a6a86;
      }
      .dsm .dsm-cycle {
        background: #c0574a;
      }
      details.cycle {
        border-left: 3px solid #c0574a;
        padding: 0.35rem 0 0.35rem 0.75rem;
        margin: 0.5rem 0;
      }
      details.cycle summary {
        cursor: pointer;
      }
      ul.cycle-edges {
        margin: 0.5rem 0 0;
      }
      pre {
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        padding: 0.5rem 0.75rem;
        overflow-x: auto;
      }
      td,
      th {
        text-align: left;
        padding: 0.25rem 1.25rem 0.25rem 0;
      }
    </style>
  </head>
  <body>
    <header>
      <b>code-atlas</b>
      <a href="/">overview</a>
      <a href="/search">search</a>
      <a href="/architecture">architecture</a>
      <span class="muted">{% block subtitle %}{% endblock %}</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
