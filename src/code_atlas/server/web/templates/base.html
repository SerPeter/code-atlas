<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}code-atlas{% endblock %}</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #666; --line: #d8d8d8; --bg: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #e8e8e8; --muted: #999; --line: #333; --bg: #16181a; }
      }
      body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      header { border-bottom: 1px solid var(--line); padding: .75rem 1.25rem; display: flex; gap: 1rem; align-items: baseline; }
      header b { font-weight: 600; }
      main { padding: 1.25rem; max-width: 60rem; }
      .muted { color: var(--muted); }
      .caveat { border-left: 3px solid #d08770; padding: .5rem .75rem; margin: 1rem 0; background: color-mix(in srgb, #d08770 8%, transparent); }
      table { border-collapse: collapse; }
      .resolved { color: #4a7c59; font-weight: 600; }
      .guess { color: #b5761f; font-weight: 600; }
      .structural { color: #5a6a86; font-weight: 600; }
      pre { background: color-mix(in srgb, var(--fg) 6%, transparent); padding: .5rem .75rem; overflow-x: auto; }
      td, th { text-align: left; padding: .25rem 1.25rem .25rem 0; }
    </style>
  </head>
  <body>
    <header>
      <b>code-atlas</b>
      <a href="/">overview</a>
      <a href="/search">search</a>
      <span class="muted">{% block subtitle %}{% endblock %}</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
