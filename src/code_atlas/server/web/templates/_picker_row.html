{# One selectable project. Included for roots and again for each monorepo child, so the
   two can never drift apart in how they present the same facts. #}
<label class="picker-row{% if project.is_current %} is-current{% endif %}">
  <input type="checkbox" name="project" value="{{ project.name }}"
         {% if project.is_current %}checked{% endif %} />

  <span class="picker-name">{{ project.label }}</span>

  <span class="picker-facts">
    <span>{{ "{:,}".format(project.entities) }} entities</span>
    {% if project.indexed_at %}
    <span class="text-muted">{{ project.indexed_at }}</span>
    {% else %}
    {# Distinct from empty: the fix is to run `atlas index`, so it must not read as
       "no data". #}
    <span class="tag tag-outline">never indexed</span>
    {% endif %}
    {% if project.short_hash %}<code class="text-muted">{{ project.short_hash }}</code>{% endif %}
  </span>

  {% if project.is_stale %}
  <span class="tag tag-accent" title="Indexed {{ project.days_since_indexed }} days ago">
    {{ project.days_since_indexed }}d old
  </span>
  {% endif %}
</label>
