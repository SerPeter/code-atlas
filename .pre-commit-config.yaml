# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # --------------------------------------------------------------------------
  # General
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '\.vscode/'
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # --------------------------------------------------------------------------
  # Python — Ruff
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --------------------------------------------------------------------------
  # Markdown & Docs — Prettier
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
        exclude: 'CHANGELOG\.md'

  # --------------------------------------------------------------------------
  # Python — ty (type checking, local — no official pre-commit hook yet)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        language: system
        # --no-sync is required, not cosmetic. A bare `uv run` re-syncs the
        # environment as a side effect, which (a) makes a lint hook mutate the
        # venv mid-commit, and (b) hard-fails whenever the project's own
        # console script is locked by a running process — `atlas mcp` or
        # `atlas daemon` holding Scripts/atlas.exe gives
        # "failed to remove file ... (os error 32)" and the commit dies with
        # the sync half-applied. A stale venv is a far better failure mode than
        # a corrupted one; run `uv sync` deliberately, with the daemon stopped.
        entry: uv run --no-sync ty check
        types: [python]
        pass_filenames: false

  # --------------------------------------------------------------------------
  # Commit messages
  # --------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
